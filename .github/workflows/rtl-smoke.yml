name: RTL Smoke Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verilator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run self-checking RTL regression
        run: bash scripts/run_verilator_smoke.sh

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axi-lite-smoke-evidence
          path: |
            results/verilator_smoke.log
            results/axi_lite_smoke.vcd
          if-no-files-found: warn
          retention-days: 30

  fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Verify checker detects injected read-data corruption
        run: bash scripts/run_fault_injection.sh

      - name: Upload fault-injection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axi-lite-fault-injection-evidence
          path: results/fault_injection.log
          if-no-files-found: warn
          retention-days: 30
